name: Private Python security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: Static application security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15.1'
          enable-cache: false
      - name: Install frozen, isolated security tools
        run: uv sync --frozen --project tools/security
      - name: Install the unchanged, digest-verified native engine
        run: |
          ENGINE_URL=$(jq -er '.platforms["linux-x86_64"].url' tools/security/engine-lock.json)
          curl --fail --silent --show-error --location "$ENGINE_URL" -o "$RUNNER_TEMP/security-engine.tar.gz"
          uv run --frozen --project tools/security python -m tools.security.install_engine "$RUNNER_TEMP/security-engine.tar.gz"
      - name: Prepare the immutable internal-use rule set
        run: |
          curl --fail --silent --show-error --location \
            https://api.github.com/repos/semgrep/semgrep-rules/tarball/16b9e6d45f10649f6a531ec4838ed9924372c3bc \
            -o "$RUNNER_TEMP/security-rules.tar.gz"
          uv run --frozen --project tools/security python tools/security/prepare_rules.py \
            "$RUNNER_TEMP/security-rules.tar.gz" "$RUNNER_TEMP/security-rules.yaml"
      - name: Verify controls and analyse every tracked Python file
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          uv run --frozen --project tools/security python -m tools.security.check \
            --rules "$RUNNER_TEMP/security-rules.yaml" --output verification/security
      - name: Retain private security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ github.sha }}
          path: verification/security/
          if-no-files-found: error
          retention-days: 14

# Shared repository privacy baseline. Application dependencies are unchanged.
# Documentation: https://github.com/edithatogo/repository-standards/blob/main/docs/privacy-secrets-standard.md
# Presidio runs in isolated Python 3.12 because its current release excludes 3.15.
# This adapter uses the existing approved setup-uv action without changing policy.
# Existing repository-specific privacy and secret checks remain independent.
name: Privacy and secrets

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '51 3 * * 3'
  workflow_dispatch:
    inputs:
      profile:
        description: Personal-identifier detection profile
        type: choice
        options: [repository, sensitive]
        default: repository

permissions:
  contents: read

concurrency:
  group: privacy-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          path: target
      - name: Check out pinned privacy tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/repository-standards
          ref: 985503bc8eae58e7d6ef36a6e5427d0077e0193c
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          path: privacy-guard-source
      - name: Set up approved isolated scanner bootstrap
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false
          cache-python: false
          working-directory: ${{ runner.temp }}
          ignore-empty-workdir: true
          add-problem-matchers: false
        env:
          UV_NO_CONFIG: '1'
      - name: Install checksum-locked privacy tooling
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          GUARD_ROOT: ${{ github.workspace }}/privacy-guard-source
          UV_NO_CONFIG: '1'
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/privacy-guard-python
          UV_CACHE_DIR: ${{ runner.temp }}/privacy-guard-uv-cache
        run: |
          test "$(git -C "$GUARD_ROOT" rev-parse HEAD)" = '985503bc8eae58e7d6ef36a6e5427d0077e0193c'
          uv python install --no-bin 3.12
          guard_python="$(uv python find --managed-python --no-project 3.12)"
          "$guard_python" -I -m venv "$RUNNER_TEMP/privacy-guard-venv"
          "$RUNNER_TEMP/privacy-guard-venv/bin/python" -I -m pip install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            -r "$GUARD_ROOT/privacy/requirements.lock"
          "$guard_python" -I "$GUARD_ROOT/scripts/install_gitleaks.py" --destination "$RUNNER_TEMP/privacy-guard-bin"
      - name: Check privacy and secrets
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          GUARD_ROOT: ${{ github.workspace }}/privacy-guard-source
          TARGET_ROOT: ${{ github.workspace }}/target
          GUARD_MODE: auto
          GUARD_PROFILE: ${{ inputs.profile || 'repository' }}
        run: |
          "$RUNNER_TEMP/privacy-guard-venv/bin/python" -I "$GUARD_ROOT/scripts/privacy_guard.py" \
            --root "$TARGET_ROOT" --binary "$RUNNER_TEMP/privacy-guard-bin/gitleaks" \
            --mode "$GUARD_MODE" --profile "$GUARD_PROFILE"


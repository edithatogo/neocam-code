[project]
name = "neocam-security-tools"
version = "1.0.0"
requires-python = ">=3.15.1,<3.16"
license = "Apache-2.0"
dependencies = ["bandit==1.9.4", "pyyaml==6.0.3"]

[tool.uv]
package = false
# Native security engines are qualified for Linux CI and the macOS checkout.
environments = ["sys_platform == 'darwin' or sys_platform == 'linux'"]
